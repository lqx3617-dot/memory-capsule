[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain_memory"
version = "1.5.1"
description = "记忆胶囊 —— 可嵌入的长期记忆库（SQLite/FTS5，PRoot 友好）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]
numpy = ["numpy>=1.24"]

[tool.setuptools]
packages = ["brain_memory"]
py-modules = ["记忆胶囊"]

[tool.setuptools.package-data]
brain_memory = ["schema.sql"]
